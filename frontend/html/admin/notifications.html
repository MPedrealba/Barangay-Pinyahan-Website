<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Barangay Pinyahan</title>
    <link rel="stylesheet" href="../../css/admin/admin-dashboard.css">
    <link rel="stylesheet" href="../../css/admin/notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../../images/Brgy._Pinyahan_Seal.png" alt="Seal" class="brand-logo">
                <h2>Barangay<br>Pinyahan</h2>
            </div>
            
            <ul class="nav-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-home"></i> HOME</a></li>
                <li><a href="complaint-dashboard.html"><i class="fas fa-exclamation-circle"></i> COMPLAINTS</a></li>
                <li><a href="news-dashboard.html"><i class="fas fa-newspaper"></i> NEWS</a></li>
                <li><a href="events-dashboard.html"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>                <li><a href="services-dashboard.html"><i class="fas fa-hands-helping"></i> SERVICES</a></li>
                <li><a href="reports-dashboard.html"><i class="fas fa-chart-line"></i> REPORTS</a></li>
                <li class="active"><a href="notifications.html"><i class="fas fa-bell"></i> NOTIFICATIONS</a></li>
                <li><a href="accounts-setting.html"><i class="fas fa-users-cog"></i> ACCOUNTS SETTING</a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-admin-profile">
                    <div class="profile-circle"><i class="fas fa-user"></i></div>
                    <div class="admin-info">
                        <span class="admin-name">John Doe</span>
                        <span class="admin-role">Administrator</span>
                    </div>
                    <a href="../homepage/admin_login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">

            <!-- Search Bar -->
            <div class="notifications-search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search">
            </div>

            <!-- Notifications Content -->
            <div class="notifications-content">

                <div class="notifications-card">

                    <!-- Header -->
                    <div class="notifications-header">
                        <h1>Notifications</h1>
                        <button class="mark-all-btn" onclick="markAllAsRead()">Mark All as Read</button>
                    </div>

                    <hr class="notifications-divider">

                    <!-- Notification Items will be injected here by JS -->
                    <div class="notifications-list" id="notifications-list">
                        <p style="text-align:center; color:#bbb; padding:30px 0;">Loading notifications...</p>
                    </div>

                </div>

            </div>

        </main>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/admin-common.js"></script>
    <script>
        async function markAllAsRead() {
            try {
                await apiPut('/api/admin/notifications/read-all', {});
                document.querySelectorAll('.notification-item.unread').forEach(item => {
                    item.classList.remove('unread');
                    const dot = item.querySelector('.unread-dot');
                    if (dot) dot.remove();
                });
            } catch (e) { console.error(e); }
        }

        // Build the deep-link href based on type + target_id
        function buildLink(type, targetId) {
            if (!targetId) return null;
            switch ((type || '').toLowerCase()) {
                case 'complaint': return `complaint-view.html?id=${targetId}`;
                case 'news':     return `news-view.html?id=${targetId}`;
                case 'event':    return `events-view.html?id=${targetId}`;
                default:         return null;
            }
        }

        // Choose icon colour class based on urgency / type
        function iconClass(n) {
            if ((n.urgency || '').toLowerCase() === 'high') return 'red';
            switch ((n.notification_type || '').toLowerCase()) {
                case 'complaint': return 'orange';
                case 'news':      return 'blue';
                case 'event':     return 'green';
                default:          return 'blue';
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            const list = document.getElementById('notifications-list');
            try {
                const data = await apiGet('/api/admin/notifications');
                if (data && data.notifications) {
                    if (data.notifications.length === 0) {
                        list.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">No notifications yet.</p>';
                        return;
                    }
                    list.innerHTML = data.notifications.map(n => {
                        const time = new Date(n.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                        const isHigh = (n.urgency || '').toLowerCase() === 'high';
                        const link  = buildLink(n.notification_type, n.target_id);
                        const ic    = iconClass(n);

                        // Wrap with <a> if we have a deep-link, otherwise use <div>
                        const wrapOpen  = link
                            ? `<a href="${link}" class="notification-item ${n.is_read ? '' : 'unread'} ${isHigh ? 'urgency-high' : ''}">`
                            : `<div class="notification-item ${n.is_read ? '' : 'unread'} ${isHigh ? 'urgency-high' : ''}">` ;
                        const wrapClose = link ? `</a>` : `</div>`;

                        return `
                            ${wrapOpen}
                                <div class="notification-icon ${ic}">
                                    <i class="${n.icon_class || 'fas fa-bell'}"></i>
                                </div>
                                <div class="notification-info">
                                    <div class="notification-title-row">
                                        <h3>${n.title}${isHigh ? ' <span class="urgency-badge">HIGH</span>' : ''}</h3>
                                        ${!n.is_read ? '<span class="unread-dot"></span>' : ''}
                                    </div>
                                    <p>${n.message}</p>
                                </div>
                                <span class="notification-time">${time}</span>
                            ${wrapClose}
                        `;
                    }).join('');
                }
            } catch (e) { 
                console.error('Failed to load notifications:', e.message || e);
                list.innerHTML = '<p style="text-align:center;color:#e53935;padding:20px;">Unable to load notifications.</p>';
            }
        });
    </script>

</body>
</html>
