<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint History - Barangay Pinyahan</title>
    <link rel="stylesheet" href="../../css/admin/admin-dashboard.css">
    <link rel="stylesheet" href="../../css/admin/complaint-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../../images/Brgy._Pinyahan_Seal.png" alt="Seal" class="brand-logo">
                <h2>Barangay<br>Pinyahan</h2>
            </div>
            
            <ul class="nav-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-home"></i> HOME</a></li>
                <li class="active"><a href="complaint-dashboard.html"><i class="fas fa-exclamation-circle"></i> COMPLAINTS</a></li>
                <li><a href="news-dashboard.html"><i class="fas fa-newspaper"></i> NEWS</a></li>
                <li><a href="events-dashboard.html"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>                
                <li><a href="services-dashboard.html"><i class="fas fa-hands-helping"></i> SERVICES</a></li>
                <li><a href="reports-dashboard.html"><i class="fas fa-chart-line"></i> REPORTS</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> NOTIFICATIONS</a></li>
                <li><a href="accounts-setting.html"><i class="fas fa-users-cog"></i> ACCOUNTS SETTING</a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-admin-profile">
                    <div class="profile-circle"><i class="fas fa-user"></i></div>
                    <div class="admin-info">
                        <span class="admin-name">John Doe</span>
                        <span class="admin-role">Administrator</span>
                    </div>
                    <a href="../homepage/admin_login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="complaint-dashboard-content">

                <!-- History Table -->
                <div class="complaints-table-container" style="margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 class="table-title" style="margin-bottom: 0;"><i class="fas fa-archive"></i> RESOLVED COMPLAINTS HISTORY</h3>
                        <a href="complaint-dashboard.html" style="background-color: #0056b3; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: background 0.3s;"><i class="fas fa-arrow-left"></i> Back to Active</a>
                    </div>
                    
                    <table class="complaints-table">
                        <thead>
                            <tr>
                                <th>REF NO.</th>
                                <th>NAME</th>
                                <th>CATEGORY</th>
                                <th>SUBMIT DATE</th>
                                <th>RESOLVED DATE</th>
                                <th>STATUS</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 20px; color: #888;">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/admin-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // Load history table
            try {
                const data = await apiGet('/api/complaints/admin/history');
                const tbody = document.getElementById('history-tbody');
                
                if (data && data.complaints && data.complaints.length > 0) {
                    tbody.innerHTML = data.complaints.map(c => {
                        const submitDate = new Date(c.submitted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                        const resolvedDate = c.resolved_at ? new Date(c.resolved_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown';
                        
                        return `
                            <tr>
                                <td>${c.ref_no}</td>
                                <td>${c.full_name}</td>
                                <td>${c.category || c.complaint_type}</td>
                                <td>${submitDate}</td>
                                <td>${resolvedDate}</td>
                                <td><span style="color: ##28a745; font-weight: bold;"><i class="fas fa-check-circle"></i> Resolved</span></td>
                                <td><a href="complaint-view.html?id=${c.id}" class="view-btn" style="background: transparent; color: #0056b3; border: 1px solid #0056b3;">Review</a></td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #888;">No resolved complaints found in history.</td></tr>';
                }
            } catch (err) { 
                console.error(err); 
                document.getElementById('history-tbody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: red;">Failed to load history data.</td></tr>';
            }
        });
    </script>

</body>
</html>
