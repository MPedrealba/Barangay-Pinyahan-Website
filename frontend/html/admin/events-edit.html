<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - Barangay Pinyahan</title>
    <link rel="stylesheet" href="../../css/admin/admin-dashboard.css">
    <link rel="stylesheet" href="../../css/admin/events-edit.css">
    <link rel="stylesheet" href="../../css/admin/success-popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../../images/Brgy._Pinyahan_Seal.png" alt="Seal" class="brand-logo">
                <h2>Barangay<br>Pinyahan</h2>
            </div>
            
            <ul class="nav-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-home"></i> HOME</a></li>
                <li><a href="complaint-dashboard.html"><i class="fas fa-exclamation-circle"></i> COMPLAINTS</a></li>
                <li><a href="news-dashboard.html"><i class="fas fa-newspaper"></i> NEWS</a></li>
                <li class="active"><a href="events-dashboard.html"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>                <li><a href="services-dashboard.html"><i class="fas fa-hands-helping"></i> SERVICES</a></li>
                <li><a href="reports-dashboard.html"><i class="fas fa-chart-line"></i> REPORTS</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> NOTIFICATIONS</a></li>
                <li><a href="accounts-setting.html"><i class="fas fa-users-cog"></i> ACCOUNTS SETTING</a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-admin-profile">
                    <div class="profile-circle"><i class="fas fa-user"></i></div>
                    <div class="admin-info">
                        <span class="admin-name">John Doe</span>
                        <span class="admin-role">Administrator</span>
                    </div>
                    <a href="../homepage/admin_login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">

            <div class="event-edit-content">

                <div class="event-edit-card">

                    <a href="events-dashboard.html" class="back-arrow"><i class="fas fa-arrow-left"></i></a>
                    <h2 style="color: #0056b3; margin-top: 5px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="fas fa-edit"></i> Edit Event Details</h2>

                    <div class="form-group">
                        <label class="form-label">NAME OF EVENT:</label>
                        <input type="text" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">DATE:</label>
                        <input type="date" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">TIME:</label>
                        <input type="time" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">LOCATION:</label>
                        <input type="text" class="form-input">
                    </div>

                    <div class="form-group photo-group">
                        <label class="form-label">EVENT PHOTO:</label>
                        <div class="photo-upload-area">
                            <img src="" alt="Event Photo" class="photo-preview" id="photoPreview">
                            <div class="photo-overlay">
                                <i class="fas fa-camera"></i>
                                <span>CHANGE PHOTO</span>
                            </div>
                            <input type="file" accept="image/*" class="photo-input" id="photoInput">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">DESCRIPTION:</label>
                        <textarea class="form-textarea"></textarea>
                    </div>

                    <div class="form-actions">
                        <button class="btn-save">Save Changes</button>
                        <a href="events-dashboard.html" class="btn-cancel">Cancel</a>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- Success Popup -->
    <div class="success-popup-overlay" id="successPopup">
        <div class="success-popup">
            <div class="success-icon"><i class="fas fa-check"></i></div>
            <h2>Saved Successfully!</h2>
            <p>Your changes have been saved.</p>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/admin-common.js"></script>
    <script>
        // Photo preview
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) { document.getElementById('photoPreview').src = ev.target.result; };
                reader.readAsDataURL(file);
            }
        });

        function showSuccessPopup(url) {
            document.getElementById('successPopup').classList.add('active');
            setTimeout(() => window.location.href = url, 1500);
        }

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');

        document.addEventListener('DOMContentLoaded', async function () {
            if (!eventId) { window.location.href = 'events-dashboard.html'; return; }
            try {
                const data = await apiGet(`/api/admin/events/${eventId}`);
                if (data && data.event) {
                    const inputs = document.querySelectorAll('.form-input');
                    inputs[0].value = data.event.name;
                    inputs[1].value = data.event.date ? data.event.date.split('T')[0] : '';
                    inputs[2].value = data.event.time || '';
                    inputs[3].value = data.event.location;
                    document.querySelector('.form-textarea').value = data.event.description || '';
                    if (data.event.photo_url) {
                        document.getElementById('photoPreview').src = API_BASE + data.event.photo_url;
                    }
                }
            } catch (e) { 
                console.warn('Backend not reachable. Loading template data...', e); 
                const inputs = document.querySelectorAll('.form-input');
                inputs[0].value = "Distribution of Food Assistance";
                inputs[1].value = "2026-01-07";
                inputs[2].value = "16:00";
                inputs[3].value = "Brgy. Court";
                document.querySelector('.form-textarea').value = "Distribution of food assistance to residents.";
            }
        });

        document.querySelector('.btn-save').onclick = async function () {
            const inputs = document.querySelectorAll('.form-input');
            const formData = new FormData();
            formData.append('name', inputs[0].value);
            formData.append('date', inputs[1].value);
            formData.append('time', inputs[2].value);
            formData.append('location', inputs[3].value);
            formData.append('description', document.querySelector('.form-textarea').value);
            const photoFile = document.getElementById('photoInput').files[0];
            if (photoFile) formData.append('photo', photoFile);

            try {
                await apiPut(`/api/admin/events/${eventId}`, formData);
                showSuccessPopup('events-dashboard.html');
            } catch (e) { alert('Failed to save: ' + e.message); }
        };
    </script>
</body>
</html>
