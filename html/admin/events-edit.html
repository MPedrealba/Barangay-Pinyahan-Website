<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - Barangay Pinyahan</title>
    <link rel="stylesheet" href="../../css/admin/admin-dashboard.css">
    <link rel="stylesheet" href="../../css/admin/events-edit.css">
    <link rel="stylesheet" href="../../css/admin/success-popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="../../images/Brgy._Pinyahan_Seal.png" alt="Seal" class="brand-logo">
                <h2>Barangay<br>Pinyahan</h2>
            </div>
            
            <ul class="nav-menu">
                <li><a href="admin-dashboard.html"><i class="fas fa-home"></i> HOME</a></li>
                <li><a href="complaint-dashboard.html"><i class="fas fa-exclamation-circle"></i> COMPLAINTS</a></li>
                <li><a href="news-dashboard.html"><i class="fas fa-newspaper"></i> NEWS</a></li>
                <li class="active"><a href="events-dashboard.html"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>                <li><a href="services-dashboard.html"><i class="fas fa-hands-helping"></i> SERVICES</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> NOTIFICATIONS</a></li>
                <li><a href="accounts-setting.html"><i class="fas fa-users-cog"></i> ACCOUNTS SETTING</a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-admin-profile">
                    <div class="profile-circle"><i class="fas fa-user"></i></div>
                    <div class="admin-info">
                        <span class="admin-name">John Doe</span>
                        <span class="admin-role">Administrator</span>
                    </div>
                    <a href="../homepage/admin_login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content">

            <div class="event-edit-content">

                <div class="event-edit-card">

                    <!-- Back Arrow -->
                    <a href="events-dashboard.html" class="back-arrow"><i class="fas fa-arrow-left"></i></a>

                    <!-- Name of Event -->
                    <div class="form-group">
                        <label class="form-label">NAME OF EVENT:</label>
                        <input type="text" class="form-input" value="Distribution of Food Assistance">
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label class="form-label">DATE:</label>
                        <input type="date" class="form-input" value="2026-01-07">
                    </div>

                    <!-- Time -->
                    <div class="form-group">
                        <label class="form-label">TIME:</label>
                        <input type="time" class="form-input" value="16:00">
                    </div>

                    <!-- Location -->
                    <div class="form-group">
                        <label class="form-label">LOCATION:</label>
                        <input type="text" class="form-input" value="Brgy. Court">
                    </div>

                    <!-- Photo Upload -->
                    <div class="form-group photo-group">
                        <label class="form-label">EVENT PHOTO:</label>
                        <div class="photo-upload-area">
                            <img src="../images/event-food-assistance.jpg" alt="Event Photo" class="photo-preview" id="photoPreview">
                            <div class="photo-overlay">
                                <i class="fas fa-camera"></i>
                                <span>CHANGE PHOTO</span>
                            </div>
                            <input type="file" accept="image/*" class="photo-input" id="photoInput">
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label">DESCRIPTION:</label>
                        <textarea class="form-textarea">We're happy to have you here! This space was created to keep our community informed, connected, and involved. Whether you're looking for the latest announcements, ongoing projects, public services, or ways to participate in our programs, everything you need is just a few clicks away.</textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="form-actions">
                        <button class="btn-save" onclick="showSuccessPopup('events-dashboard.html')">Save Changes</button>
                        <a href="events-dashboard.html" class="btn-cancel">Cancel</a>
                    </div>

                </div>

            </div>

        </main>
    </div>

    <script>
        // Photo preview on file select
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    photoPreview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>


    <!-- Success Popup -->
    <div class="success-popup-overlay" id="successPopup">
        <div class="success-popup">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2>Saved Successfully!</h2>
            <p>Your changes have been saved.</p>
        </div>
    </div>

    <script>
        function showSuccessPopup(redirectUrl) {
            document.getElementById('successPopup').classList.add('active');
            setTimeout(function() {
                window.location.href = redirectUrl;
            }, 1500);
        }
    </script>
</body>
</html>
